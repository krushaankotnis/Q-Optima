services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-qoptima}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 10
  quantum-service:
    build: ./quantum-service
    restart: unless-stopped
    environment:
      IBM_API_KEY: ${IBM_API_KEY:-}
      IBM_INSTANCE_CRN: ${IBM_INSTANCE_CRN:-}
      QUANTUM_SERVICE_PORT: ${QUANTUM_SERVICE_PORT:-8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 5
  backend:
    build: ./backend
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-5000}
      QUANTUM_SERVICE_URL: http://quantum-service:8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-qoptima}
    depends_on:
      postgres: { condition: service_healthy }
      quantum-service: { condition: service_healthy }
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "3000:80"
volumes:
  postgres-data:
